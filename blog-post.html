<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      <style>
      /* Additional styles for blog post content */
      #post-content h2 {
        font-size: 2rem;
        font-weight: 700;
        color: #1f2937;
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
      #post-content h3 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #374151;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
      }

      #post-content p {
        color: #4b5563;
        line-height: 1.8;
        margin-bottom: 1.25rem;
        font-size: 1.125rem;
      }

      #post-content ul,
      #post-content ol {
        margin-left: 2rem;
        margin-bottom: 1.25rem;
        color: #4b5563;
        line-height: 1.8;
      }

      #post-content li {
        margin-bottom: 0.5rem;
        font-size: 1.125rem;
      }

      #post-content pre {
        background-color: #1f2937;
        color: #f3f4f6;
        padding: 1.5rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        margin-bottom: 1.25rem;
        font-size: 0.875rem;
      }

      #post-content code {
        font-family: "Courier New", monospace;
      }

      #post-content strong {
        font-weight: 600;
        color: #1f2937;
      }
    </style>
    <title>Document</title>
</head>
<body>
     <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between">
            <!---logo-->
            <a href="index.html" class="flex">
                <h2 class="text-lg font-semibold relative group overflow-hidden">
                    Learn Coading
                <span class="absolute w-full h-0.5 bg-blue-600 left-0 bottom-0 -translate-x-full group-hover:translate-x-0 ease-in-out duration-300"></span>
                </h2>
            </a>
            <!---links-->
            <div class="flex items-center gap-8">
                <a href="home.html" class="text-sm font-medium hover:text-blue-600 duration-300">Home</a>
                <a href="blog.html" class="text-sm font-medium hover:text-blue-600 duration-300">Blog</a>
            </div>
        </nav>
    </header>
    <!--Blog Content-->
    <article class="py-12">
        <div class="max-w-4xl mx-auto px-6">
            <!--post-header-->
            <div id="post-header">
              </div>
              <div id="featured-image" class="mb-12">

              </div>
            <!--post content-->
            <div id="post-content" class="prose prose-lg max-w-none">

            </div>
             <!-- Back to Blog Button -->
        <div class="mt-12 pt-8 border-t border-gray-200">
          <a
            href="blog.html"
            class="inline-flex items-center text-blue-600 hover:text-blue-800 font-semibold transition-colors"
          >
            <svg
              class="w-5 h-5 mr-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
            Back to All Posts
          </a>
        </div>
        </div>
    </article>
     <!-- Related Posts Section -->
    <section class="py-16 bg-white">
      <div class="max-w-6xl mx-auto px-6">
        <h2 class="text-3xl font-bold text-gray-900 mb-8">Related Articles</h2>
        <div
          id="related-posts"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
        >
          <!-- Related posts will be inserted here by JavaScript -->
        </div>
      </div>
    </section>
       <footer class="bg-gray-800 text-white py-8 mt-16 ">
        <a href="https://invertotech.com/" target="_blank" 
        class="text-center  text-gray-200 hover:text-blue-600 transition duration-300">
            <p class=" text-sm md:text-base">&copy; 2026 InvertoTech. All rights reserved.</p>
       </a>
    </footer>
    <script src="script.js"></script>
</body>
</html>
